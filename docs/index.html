<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<meta name="description" content="Psicoterapia para adolescentes e adultos, online ou presencial em São Paulo. Escolha um horário livre e agende em poucos minutos.">
<title>Helena Duarte | Psicóloga clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>/* VOZ    calma e acolhedora: poucas cores, muito espaço, detalhes finos
   IDEIA  a sala de espera de um consultório tranquilo e a agenda de papel da profissional
   FIGURA ilustração do consultório (janela ao amanhecer, duas poltronas frente a frente)
   CORES  azul profundo dominante, areia clara de apoio, coral como acento de ação
   TIPO   Fraunces nos títulos + Figtree no texto
   LAYOUT topo em duas colunas (texto | ilustração), agenda em duas colunas (escolha | dados);
          no celular tudo empilha: texto, ilustração, agenda */

:root {
  color-scheme: light;
  --azul: #1f3a5f;
  --azul-2: #2c4f7c;
  --azul-escuro: #142840;
  --coral: #e8664a;
  --coral-escuro: #c9503a;
  --coral-claro: #fde5dc;
  --areia: #f7f0ea;
  --tinta: #1b2433;
  --suave: #596377;
  --borda: #e4dcd3;
  --branco: #ffffff;
  --erro: #b3261e;
  --titulo: var(--font-fraunces, 'Fraunces'), Georgia, 'Times New Roman', serif;
  --texto: var(--font-figtree, 'Figtree'), system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  min-width: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  margin: 0;
  background: var(--branco);
  color: var(--tinta);
  font: 17px/1.6 var(--texto);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3 {
  font-family: var(--titulo);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -0.015em;
  text-wrap: balance;
  margin: 0 0 12px;
}

h1 {
  font-size: clamp(34px, 5vw, 54px);
}

h2 {
  font-size: clamp(28px, 3.4vw, 40px);
}

h3 {
  font-size: 21px;
}

p {
  margin: 0 0 14px;
}

a {
  color: var(--azul-2);
}

img,
svg {
  max-width: 100%;
}

:focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 2px;
}

/* ---------- botões ---------- */

.botao {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 12px 26px;
  border: 2px solid var(--coral);
  border-radius: 999px;
  background: var(--coral);
  color: var(--branco);
  font: 600 17px/1.2 var(--texto);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
}

.botao:hover {
  background: var(--coral-escuro);
  border-color: var(--coral-escuro);
}

.botao:active {
  transform: translateY(1px);
}

.botao:disabled,
fieldset:disabled .botao {
  opacity: 0.45;
  cursor: not-allowed;
}

.botao.claro {
  background: var(--branco);
  border-color: var(--borda);
  color: var(--azul);
}

.botao.claro:hover {
  border-color: var(--azul);
}

.botao.pequeno {
  min-height: 44px;
  padding: 8px 20px;
  font-size: 16px;
}

.botao.largo {
  width: 100%;
}

.botao-texto,
.link-botao {
  min-height: 44px;
  padding: 8px 4px;
  border: none;
  background: none;
  color: var(--azul-2);
  font: 600 16px var(--texto);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

.link-botao {
  color: var(--erro);
}

/* ---------- estrutura ---------- */

.banner-demo {
  padding: 8px 16px;
  background: var(--coral-claro);
  color: var(--azul-escuro);
  font-size: 14px;
  text-align: center;
}

.topo {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 12px max(5vw, 16px);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--borda);
}

.marca {
  display: flex;
  flex-direction: column;
  margin-right: auto;
  color: var(--azul);
  text-decoration: none;
  line-height: 1.15;
}

.marca-nome {
  font: 600 21px var(--titulo);
}

.marca-titulo {
  font-size: 14px;
  color: var(--suave);
}

.menu {
  display: flex;
  gap: 24px;
}

.menu a {
  color: var(--tinta);
  text-decoration: none;
  font-weight: 500;
}

.menu a:hover {
  color: var(--coral-escuro);
}

.faixa {
  padding: clamp(52px, 6vw, 92px) max(5vw, 16px);
}

.faixa > * {
  max-width: 1160px;
  margin-inline: auto;
}

.faixa.suave {
  background: var(--areia);
}

.faixa-titulo {
  margin-bottom: 32px;
}

.faixa-titulo p {
  color: var(--suave);
  margin: 0;
}

/* ---------- topo da página ---------- */

.heroi {
  display: grid;
  gap: 36px;
  align-items: center;
  padding: clamp(40px, 6vw, 88px) max(5vw, 16px);
  background: var(--azul);
  color: var(--branco);
}

.heroi-texto {
  max-width: 560px;
}

.heroi-sobre {
  color: #c8d6ea;
  font-size: 16px;
}

.heroi h1 {
  color: var(--branco);
  margin-bottom: 18px;
}

.heroi-descricao {
  color: #e3ebf6;
  font-size: 18px;
}

.heroi-fatos {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  margin: 22px 0 28px;
  list-style: none;
}

.heroi-fatos li {
  padding: 6px 14px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 999px;
  font-size: 15px;
  white-space: nowrap;
}

.heroi-acoes {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.heroi .botao.claro {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.5);
  color: var(--branco);
}

.heroi .botao.claro:hover {
  border-color: var(--branco);
}

.heroi-figura {
  position: relative;
  height: clamp(280px, 62vw, 470px);
  border-radius: 999px 999px 28px 28px;
  overflow: hidden;
  background: #f6efe9;
  box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.08);
}

.ilustracao {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

@media (min-width: 900px) {
  .heroi {
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr);
    gap: clamp(40px, 5vw, 80px);
    padding-inline: max(5vw, calc((100vw - 1160px) / 2));
  }
}

/* ---------- agenda ---------- */

.agenda {
  display: grid;
  gap: 20px;
}

@media (min-width: 900px) {
  .agenda {
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  .agenda-painel {
    position: sticky;
    top: 96px;
  }
}

.agenda-escolha,
.agenda-painel {
  padding: clamp(20px, 3vw, 32px);
  border: 1px solid var(--borda);
  border-radius: 24px;
  background: var(--branco);
}

.agenda-painel {
  background: var(--areia);
  border-color: transparent;
}

.rotulo-etapa {
  font: 600 15px var(--texto);
  letter-spacing: 0;
  color: var(--suave);
  margin: 0 0 12px;
}

.dia-extenso {
  font-weight: 400;
}

.dias {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 10px;
  margin-bottom: 18px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
}

.dia {
  flex: 0 0 auto;
  scroll-snap-align: start;
  width: 70px;
  padding: 10px 4px;
  border: 1.5px solid var(--borda);
  border-radius: 16px;
  background: var(--branco);
  color: var(--tinta);
  font: inherit;
  text-align: center;
  cursor: pointer;
}

.dia span {
  display: block;
  font-size: 14px;
  color: var(--suave);
  text-transform: capitalize;
}

.dia strong {
  font-size: 17px;
}

.dia:hover:not(:disabled),
.horario:hover:not(:disabled) {
  border-color: var(--azul-2);
}

.horarios {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px;
}

.horario {
  min-height: 48px;
  border: 1.5px solid var(--borda);
  border-radius: 12px;
  background: var(--branco);
  color: var(--tinta);
  font: 600 17px var(--texto);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.dia.ativo,
.horario.ativo {
  border-color: var(--azul);
  background: var(--azul);
  color: var(--branco);
}

.dia.ativo span {
  color: #c8d6ea;
}

.dia:disabled,
.horario:disabled {
  cursor: default;
}

.resumo {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 20px;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--branco);
  border-left: 4px solid var(--coral);
}

.resumo strong {
  font-size: 18px;
}

.resumo span {
  color: var(--suave);
}

.resumo.vazio {
  border-left-color: var(--borda);
}

fieldset {
  border: 0;
  padding: 0;
  margin: 0;
}

fieldset:disabled .campo {
  opacity: 0.55;
}

.campo {
  margin-bottom: 14px;
}

.campo label {
  display: block;
  margin-bottom: 4px;
  font-size: 15px;
  font-weight: 600;
}

.campo input {
  width: 100%;
  min-height: 50px;
  padding: 12px 14px;
  border: 1.5px solid var(--borda);
  border-radius: 12px;
  background: var(--branco);
  color: var(--tinta);
  font: 16px var(--texto);
}

.campo input:focus {
  outline: none;
  border-color: var(--azul-2);
  box-shadow: 0 0 0 3px rgba(44, 79, 124, 0.15);
}

.escondido {
  position: absolute;
  left: -9999px;
}

.consentimento {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 6px 0 18px;
  font-size: 15px;
  cursor: pointer;
}

.consentimento input {
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  accent-color: var(--azul);
}

.aviso {
  color: var(--suave);
}

.aviso.pequeno {
  margin: 12px 0 0;
  font-size: 14px;
}

.erro {
  color: var(--erro);
  font-size: 15px;
  font-weight: 500;
}

.pagamento,
.confirmacao {
  text-align: center;
}

.valor-grande {
  margin: 0;
  font: 600 40px var(--titulo);
  color: var(--azul);
}

.qr {
  display: block;
  width: 172px;
  height: 172px;
  margin: 8px auto 12px;
  border-radius: 12px;
  shape-rendering: crispEdges;
}

.pagamento .botao-texto,
.confirmacao .botao-texto {
  margin-top: 6px;
}

.selo-ok {
  width: 56px;
  height: 56px;
  margin-bottom: 8px;
}

.quando {
  font: 600 22px var(--titulo);
  color: var(--azul);
}

.rotulo-previa {
  margin: 22px 0 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--suave);
  text-align: left;
}

.previa-mensagem {
  padding: 14px 16px 10px;
  border-radius: 4px 18px 18px 18px;
  background: var(--branco);
  text-align: left;
  font-size: 15px;
  box-shadow: 0 1px 2px rgba(27, 36, 51, 0.08);
}

.previa-mensagem p {
  margin-bottom: 6px;
}

.previa-mensagem span {
  display: block;
  text-align: right;
  font-size: 13px;
  color: var(--suave);
}

.confirmacao-acoes {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 20px;
}

/* ---------- seções ---------- */

.passos {
  display: grid;
  gap: 20px;
  padding: 0;
  margin-top: 0;
  margin-bottom: 0;
  list-style: none;
}

@media (min-width: 760px) {
  .passos {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.passos li {
  padding: 26px;
  border-radius: 22px;
  background: var(--branco);
}

.passos svg {
  width: 48px;
  height: 48px;
  margin-bottom: 14px;
}

.passos p {
  color: var(--suave);
  margin: 0;
}

.sobre {
  display: grid;
  gap: 36px;
  align-items: center;
}

@media (min-width: 820px) {
  .sobre {
    grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr);
    gap: clamp(40px, 6vw, 96px);
    padding-inline: max(5vw, calc((100vw - 1160px) / 2));
  }
  .sobre > * {
    max-width: none;
    margin: 0;
  }
}

.retrato {
  position: relative;
  display: grid;
  place-items: center;
  width: min(100%, 340px);
  aspect-ratio: 4 / 5;
  margin-inline: auto;
  border-radius: 999px 999px 28px 28px;
  background: var(--azul);
  overflow: hidden;
}

.retrato::before {
  content: '';
  position: absolute;
  width: 70%;
  aspect-ratio: 1;
  right: -18%;
  bottom: -14%;
  border-radius: 50%;
  background: var(--coral);
}

.retrato::after {
  content: '';
  position: absolute;
  width: 44%;
  aspect-ratio: 1;
  left: -12%;
  top: 30%;
  border-radius: 50%;
  background: var(--azul-2);
}

.retrato span {
  position: relative;
  z-index: 1;
  font: 600 clamp(72px, 12vw, 120px) var(--titulo);
  color: var(--branco);
}

.sobre-texto p {
  color: #3a4456;
}

.ficha {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 24px 0;
  padding: 18px 0;
  border-top: 1px solid var(--borda);
  border-bottom: 1px solid var(--borda);
}

.ficha dt {
  font-size: 14px;
  color: var(--suave);
}

.ficha dd {
  margin: 0;
  font-weight: 600;
}

.temas {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.temas li {
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--areia);
  font-size: 15px;
}

.cartoes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
  gap: 20px;
}

.cartao-info {
  padding: 26px;
  border-radius: 22px;
  background: var(--branco);
}

.cartao-info p {
  color: var(--suave);
  margin: 0;
}

.cartao-info.destaque {
  background: var(--azul);
  color: var(--branco);
}

.cartao-info.destaque h3 {
  font-size: 32px;
}

.cartao-info.destaque p {
  color: #d9e3f1;
}

.lista-duvidas {
  display: grid;
  gap: 0 40px;
}

@media (min-width: 860px) {
  .lista-duvidas {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.lista-duvidas details {
  border-bottom: 1px solid var(--borda);
}

.lista-duvidas summary {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 0;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.lista-duvidas summary::-webkit-details-marker {
  display: none;
}

.lista-duvidas summary::after {
  content: '+';
  flex: none;
  font-size: 24px;
  line-height: 1;
  color: var(--coral);
}

.lista-duvidas details[open] summary::after {
  content: '–';
}

.lista-duvidas details p {
  color: var(--suave);
  padding-bottom: 8px;
}

.chamada {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: clamp(40px, 5vw, 64px) max(5vw, calc((100vw - 1160px) / 2), 16px);
  background: var(--coral-claro);
}

.chamada h2 {
  margin: 0;
  color: var(--azul);
}

.rodape {
  padding: 48px max(5vw, calc((100vw - 1160px) / 2), 16px) 32px;
  background: var(--azul-escuro);
  color: #c8d3e3;
  font-size: 15px;
}

.rodape a {
  color: var(--branco);
}

.rodape-grade {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 24px;
}

.rodape-nome {
  font: 600 22px var(--titulo);
  color: var(--branco);
  margin-bottom: 4px;
}

.rodape-rotulo {
  color: var(--branco);
  font-weight: 600;
  margin-bottom: 4px;
}

.rodape-links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin: 32px 0 0;
  padding-top: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
}

/* ---------- páginas internas ---------- */

.cartao-login {
  max-width: 420px;
  padding: 32px;
  border-radius: 24px;
  background: var(--areia);
}

.cartao-login h1 {
  font-size: 32px;
}

.texto-legal {
  max-width: 720px;
}

.texto-legal h1 {
  font-size: clamp(32px, 4vw, 44px);
}

.texto-legal h2 {
  font-size: 22px;
  margin-top: 28px;
}

.texto-legal p {
  color: #3a4456;
}

.pagina-aviso {
  max-width: 560px;
  padding: 36px 28px;
  border-radius: 24px;
  background: var(--areia);
  text-align: center;
}

/* ---------- painel ---------- */

.painel-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.painel-topo p {
  color: var(--suave);
  margin: 0;
}

.numeros {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
  gap: 12px;
  margin-bottom: 32px;
}

.numeros div {
  padding: 18px 20px;
  border-radius: 18px;
  background: var(--areia);
}

.numeros strong {
  display: block;
  font: 600 clamp(28px, 4vw, 36px) var(--titulo);
  color: var(--azul);
  white-space: nowrap;
}

.numeros span {
  color: var(--suave);
  font-size: 15px;
}

.grupo-dia {
  margin-bottom: 28px;
}

.grupo-dia h2 {
  font-size: 20px;
  margin: 0 0 4px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--azul);
}

.lista-admin {
  list-style: none;
  padding: 0;
  margin: 0;
}

.item-admin {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
  padding: 14px 0;
  border-bottom: 1px solid var(--borda);
}

.item-hora {
  font: 600 20px var(--titulo);
  color: var(--azul);
  font-variant-numeric: tabular-nums;
}

.item-pessoa strong {
  margin-right: 8px;
}

.etiqueta {
  display: inline-block;
  padding: 1px 10px;
  border-radius: 999px;
  background: #e2eee6;
  color: #2b6146;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.etiqueta.pendente {
  background: #fbeed6;
  color: #8a5a12;
}

.acoes-admin {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 4px;
  font-size: 15px;
  color: var(--suave);
}

.item-email {
  overflow-wrap: anywhere;
}

.confirmar-cancelar {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

/* ---------- celular ---------- */

@media (max-width: 720px) {
  .menu {
    display: none;
  }
  .marca-nome {
    font-size: 19px;
  }
}

@media (max-width: 560px) {
  body {
    font-size: 16px;
  }
  .item-admin {
    grid-template-columns: 52px minmax(0, 1fr);

  }
}

  html {
    scroll-behavior: auto;
  }
  * {
    transition: none !important;
  }
}
